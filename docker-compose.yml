# One-command quickstart.
#
#   docker compose up --build demo     # explore the unknown house, then go to objects
#   docker compose up --build test     # unit + lint tests (what CI runs)
#
# RViz: allow local X connections once (`xhost +local:docker`), then
#   RVIZ=true docker compose up --build demo
# Faster camera rendering on an Intel / AMD GPU (default: software rendering, works anywhere):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build demo
# Results (exploration CSV, semantic map YAML, scores) land in ./demo_output/.
services:
  test:
    build:
      context: .
      target: test

  demo:
    build:
      context: .
      target: demo
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - RVIZ=${RVIZ:-false}
      - DEMO_OBJECTS=${DEMO_OBJECTS:-toilet,potted plant,tv}
      - DEMO_OUT=/out
      - HOST_UID=${HOST_UID:-1000}   # owner of ./demo_output afterwards (`id -u`)
      - HOST_GID=${HOST_GID:-1000}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./demo_output:/out
      - gz_fuel:/root/.gz       # Gazebo Fuel furniture models: downloaded once (~70 MB)

volumes:
  gz_fuel:
