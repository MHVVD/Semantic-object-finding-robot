# Single source of truth for every node parameter in the project.
# Nodes declare parameters without defaults, so a missing key fails loudly.

detector_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /oakd/rgb/preview/image_raw
    detections_topic: /semantic_nav/detections
    debug_image_topic: /semantic_nav/detections_image
    # Relative paths resolve inside semantic_nav_perception's share directory;
    # tools/export_yolo.py writes both files (see M3 report for the model choice).
    model_path: models/yolo11n.onnx
    class_names_path: models/yolo11n.yaml
    # 640x480 = the camera resolution: no resize, no padding (multiples of 32).
    input_width: 640
    input_height: 480
    # 0.3: recall 0.42 / precision 0.85 on the M3 evaluation (0.4: 0.35 / 0.88).
    # The semantic map needs repeated observations, which filters one-off false
    # positives, so recall is worth more than precision here.
    confidence_threshold: 0.3
    iou_threshold: 0.5
    # The COCO classes placed in worlds/house.sdf. ['*'] = all 80 classes.
    class_whitelist: [chair, couch, potted plant, bed, dining table, toilet, tv, sink,
                      refrigerator]
    device: CPU
    num_threads: 0            # 0 = let OpenVINO choose (all physical cores)
    # 5 Hz of image time is plenty for the semantic map; processing every 10 Hz
    # frame cost 17 % real-time factor vs 6.5 % at 5 Hz (M3 report). 0 = every frame.
    max_rate_hz: 5.0
    stats_period_s: 5.0

# Dataset recorder (not part of the running system; see capture.launch.py).
capture_frames:
  ros__parameters:
    use_sim_time: true
    image_topic: /oakd/rgb/preview/image_raw
    gt_boxes_topic: /oakd/gt_boxes   # '' when the sim runs without gt_boxes:=true
    output_dir: ~/semantic_nav_data/frames
    class_names_path: models/yolo11n.yaml
    min_period_s: 1.0
    min_translation_m: 0.3
    min_rotation_rad: 0.35
    map_frame: map
    base_frame: base_link
    max_pending: 30

projector_node:
  ros__parameters:
    use_sim_time: true
    detections_topic: /semantic_nav/detections
    depth_topic: /oakd/rgb/preview/depth
    camera_info_topic: /oakd/rgb/preview/camera_info
    output_topic: /semantic_nav/observations
    markers_topic: /semantic_nav/observation_markers
    target_frame: map
    # Depth = median of the valid pixels in the central bbox_shrink x bbox_shrink
    # part of the box: the box edges are mostly background (walls behind a chair).
    bbox_shrink: 0.5
    min_depth_m: 0.3          # camera near clip
    max_depth_m: 4.0          # beyond this depth noise / tiny boxes dominate
    min_valid_fraction: 0.2
    # Detector output, depth and camera_info carry identical stamps in sim; the slop
    # only has to absorb jitter on real hardware. Queue covers the detector latency
    # (~60-90 ms) at 10 Hz depth.
    sync_queue_size: 10
    sync_slop_s: 0.02
    tf_timeout_s: 0.2
    marker_lifetime_s: 1.0
    stats_period_s: 10.0

# Depth camera -> LaserScan of table tops / chair seats for the Nav2 costmaps
# (navigation.launch.py, exploration.launch.py; observation source depth_scan).
depth_scan_node:
  ros__parameters:
    use_sim_time: true
    depth_topic: /oakd/rgb/preview/depth
    camera_info_topic: /oakd/rgb/preview/camera_info
    scan_topic: /depth_scan
    target_frame: base_link       # on the floor (Create3): z = height above the floor
    decimation: 4                 # 160 x 120 points: plenty for a 5 cm costmap at <= 3 m
    min_height_m: 0.05            # above the floor (and its depth noise)
    max_height_m: 1.0             # table tops 0.74 m, counters; the robot is 0.35 m tall
    range_min_m: 0.25
    range_max_m: 3.0              # depth is reliable to ~3-4 m (M4)
    angle_increment_rad: 0.01
    max_rate_hz: 5.0
    tf_timeout_s: 1.0

semantic_map_node:
  ros__parameters:
    use_sim_time: true
    observations_topic: /semantic_nav/observations
    map_topic: /semantic_nav/semantic_map
    markers_topic: /semantic_nav/markers
    list_objects_service: /semantic_nav/list_objects
    save_service: /semantic_nav/save_map
    load_service: /semantic_nav/load_map
    map_frame: map
    # Tuned by replaying the 1192 recorded M4 observations (semantic_map_eval.py
    # --sweep): 0.75 m keeps single-frame scatter (~0.2 m) of one object together;
    # beds and couches are 2-3 m long, so views of their different ends need a
    # bigger gate or they split into several objects.
    association_radius_m: 0.75
    class_radius: ['bed=2.0', 'couch=1.5']
    association_method: greedy      # or hungarian (identical results on our data)
    # 10 sightings (~2 s of looking at 5 Hz): false positives 16 -> 4 vs N = 3 with
    # no real object lost; tentative objects are forgotten after 10 s unseen.
    min_observations: 10
    tentative_timeout_s: 10.0
    publish_period_s: 1.0
    map_file: ~/semantic_nav_data/semantic_map.yaml
    load_on_start: false

commander_node:
  ros__parameters:
    use_sim_time: true
    goto_service: /semantic_nav/go_to
    cancel_service: /semantic_nav/cancel
    list_objects_service: /semantic_nav/list_objects
    nav_action_name: navigate_to_pose
    plan_action_name: compute_path_to_pose
    costmap_topic: /global_costmap/costmap_raw
    goal_frame: map
    robot_frame: base_link
    # First radius = the standoff distance; the others are fallbacks when no
    # valid pose exists at 0.8 m (furniture all around, object in a corner).
    standoff_radii_m: [0.8, 1.0, 1.2, 0.6]
    num_samples: 24                 # one candidate every 15 deg
    max_goal_cost: 200              # stay out of the strongest inflation (253 = inscribed)
    max_detour_factor: 1.5          # local free space: reachable within 1.5 x radius
    cost_weight: 1.0                # a cost-252 cell counts like 1 m of extra distance
    candidates_per_object: 3        # planner calls per instance
    # Ignore instances seen < 25 % as often as the best-seen one of that label:
    # removes phantom beds / chairs from consistent detector mistakes (M5).
    min_relative_evidence: 0.25
    label_aliases: ['fridge=refrigerator', 'sofa=couch', 'television=tv', 'telly=tv',
                    'plant=potted plant', 'table=dining table', 'loo=toilet']
    server_timeout_s: 5.0
    feedback_period_s: 5.0

voice_command:
  ros__parameters:
    use_sim_time: true
    model_path: ~/semantic_nav_data/models/vosk-model-small-en-us-0.15
    audio_device: default
    input_wav: ""                   # set to a .wav to test without a microphone
    sample_rate: 16000
    # Everything the user may say: COCO labels in the house + the aliases above.
    names: [refrigerator, fridge, couch, sofa, tv, television, chair, bed, toilet, sink,
            potted plant, plant, dining table, table]
    goto_service: /semantic_nav/go_to
    cancel_service: /semantic_nav/cancel
    heard_topic: /semantic_nav/voice/heard
    chunk_s: 0.25                   # audio per recogniser call
    discovery_settle_s: 0.5         # first reply is lost if we call too early (#62)

# Autonomous exploration (exploration.launch.py explorer:=frontier).
frontier_explorer:
  ros__parameters:
    use_sim_time: true
    map_topic: /map
    nav_action_name: navigate_to_pose
    status_topic: /semantic_nav/exploration/status
    markers_topic: /semantic_nav/exploration/markers
    map_frame: map
    robot_frame: base_link
    clearance_m: 0.25            # robot radius 0.19 m + margin
    min_frontier_m: 0.3          # ignore slivers of unknown (doorway jambs, noise)
    gain_weight: 1.0             # 1 m of frontier is worth 1 m of driving
    decision_period_s: 1.0
    progress_timeout_s: 10.0     # sim s; stuck -> cancel and blacklist (was 20 s WALL: #92)
    goal_timeout_s: 60.0         # sim s; hard cap per goal (e.g. a goal under a table)
    coverage_budget_s: 150.0     # sim s for phase 2 (run 2 spent 500+ s for 0 new objects)
    blacklist_radius_m: 0.5
    camera_coverage: true        # phase 2: look at every surface with the camera
    camera_hfov_rad: 1.25        # the OAK-D in the URDF
    camera_range_m: 3.0          # detector + depth are reliable to ~3 m (M3/M4)
    coverage_tile_m: 1.0
    min_unseen_cells: 6          # 0.3 m of unseen surface at 5 cm cells
    view_min_m: 1.0
    view_max_m: 2.5
    return_to_start: true
    start_tolerance_m: 0.5       # already home: no return goal
    progress_step_m: 0.1         # distance to the goal must shrink by this to count
    near_goal_m: 0.4             # final turn on the spot is not "stuck" (#75)
    revealed_radius_m: 0.25      # frontier goal dropped once its frontier is gone
    coverage_update_period_s: 0.5
