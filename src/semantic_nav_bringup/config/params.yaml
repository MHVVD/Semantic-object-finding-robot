# Single source of truth for every node parameter in the project.
# Nodes declare parameters without defaults, so a missing key fails loudly.

detector_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /oakd/rgb/preview/image_raw
    detections_topic: /semantic_nav/detections
    debug_image_topic: /semantic_nav/detections_image
    # Relative paths resolve inside semantic_nav_perception's share directory;
    # tools/export_yolo.py writes both files (see M3 report for the model choice).
    model_path: models/yolo11n.onnx
    class_names_path: models/yolo11n.yaml
    # 640x480 = the camera resolution: no resize, no padding (multiples of 32).
    input_width: 640
    input_height: 480
    # 0.3: recall 0.42 / precision 0.85 on the M3 evaluation (0.4: 0.35 / 0.88).
    # The semantic map needs repeated observations, which filters one-off false
    # positives, so recall is worth more than precision here.
    confidence_threshold: 0.3
    iou_threshold: 0.5
    # The COCO classes placed in worlds/house.sdf. ['*'] = all 80 classes.
    class_whitelist: [chair, couch, potted plant, bed, dining table, toilet, tv, sink,
                      refrigerator]
    device: CPU
    num_threads: 0            # 0 = let OpenVINO choose (all physical cores)
    # 5 Hz of image time is plenty for the semantic map; processing every 10 Hz
    # frame cost 17 % real-time factor vs 6.5 % at 5 Hz (M3 report). 0 = every frame.
    max_rate_hz: 5.0
    stats_period_s: 5.0

# Dataset recorder (not part of the running system; see capture.launch.py).
capture_frames:
  ros__parameters:
    use_sim_time: true
    image_topic: /oakd/rgb/preview/image_raw
    gt_boxes_topic: /oakd/gt_boxes   # '' when the sim runs without gt_boxes:=true
    output_dir: ~/semantic_nav_data/frames
    class_names_path: models/yolo11n.yaml
    min_period_s: 1.0
    min_translation_m: 0.3
    min_rotation_rad: 0.35
    map_frame: map
    base_frame: base_link

projector_node:
  ros__parameters:
    use_sim_time: true
    detections_topic: /semantic_nav/detections
    depth_topic: /oakd/rgb/preview/depth
    camera_info_topic: /oakd/rgb/preview/camera_info
    output_topic: /semantic_nav/observations
    markers_topic: /semantic_nav/observation_markers
    target_frame: map
    # Depth = median of the valid pixels in the central bbox_shrink x bbox_shrink
    # part of the box: the box edges are mostly background (walls behind a chair).
    bbox_shrink: 0.5
    min_depth_m: 0.3          # camera near clip
    max_depth_m: 4.0          # beyond this depth noise / tiny boxes dominate
    min_valid_fraction: 0.2
    # Detector output, depth and camera_info carry identical stamps in sim; the slop
    # only has to absorb jitter on real hardware. Queue covers the detector latency
    # (~60-90 ms) at 10 Hz depth.
    sync_queue_size: 10
    sync_slop_s: 0.02
    tf_timeout_s: 0.2
    marker_lifetime_s: 1.0

semantic_map_node:
  ros__parameters:
    use_sim_time: true
    observations_topic: /semantic_nav/observations
    map_topic: /semantic_nav/semantic_map
    markers_topic: /semantic_nav/markers
    list_objects_service: /semantic_nav/list_objects
    save_service: /semantic_nav/save_map
    load_service: /semantic_nav/load_map
    map_frame: map
    # Tuned by replaying the 1192 recorded M4 observations (semantic_map_eval.py
    # --sweep): 0.75 m keeps single-frame scatter (~0.2 m) of one object together;
    # beds and couches are 2-3 m long, so views of their different ends need a
    # bigger gate or they split into several objects.
    association_radius_m: 0.75
    class_radius: ['bed=2.0', 'couch=1.5']
    association_method: greedy      # or hungarian (identical results on our data)
    # 10 sightings (~2 s of looking at 5 Hz): false positives 16 -> 4 vs N = 3 with
    # no real object lost; tentative objects are forgotten after 10 s unseen.
    min_observations: 10
    tentative_timeout_s: 10.0
    publish_period_s: 1.0
    map_file: ~/semantic_nav_data/semantic_map.yaml
    load_on_start: false

commander_node:
  ros__parameters:
    use_sim_time: true
    list_objects_service: /semantic_nav/list_objects
    nav_action_name: navigate_to_pose
    standoff_distance_m: 0.8
    goal_frame: map
